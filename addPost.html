<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Post</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <nav>
      <ul class="nav">
        <li><a href="index.html">Home</a></li>
      </ul>
    </nav>

    <a class="profile-link" href="login.html">
        <img class="profile-picture"
          src="res/images/profile.svg"
          width="50"
          height="50"
          alt="Profile picture">
      </a>
  </header>

  <main>
    <form class="post-form" action="index.html">
      
      <label for="post-body">Post body</label>
      <textarea id="post-body" name="post-body" placeholder="textarea"></textarea>

      <label for="post-file">Select file</label>
      <input id="post-file" type="file" name="post-file">

      <input class="create-post" type="submit" value="Create post">

    </form>
  </main>

</body>

</html>
